<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELO — Saúde do produto</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101820; color: #eef5f7; }
    body { max-width: 980px; margin: 0 auto; padding: 28px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input, button { border: 1px solid #49636f; border-radius: 8px; padding: 10px 12px; background: #172631; color: inherit; }
    button { cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 24px; }
    .card { border: 1px solid #284450; border-radius: 12px; padding: 16px; background: #14222b; }
    .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
    .healthy { color: #6ee7a8; } .degraded { color: #ffd166; } .unhealthy { color: #ff7b7b; }
    #status { margin-top: 18px; min-height: 24px; }
  </style>
</head>
<body>
  <header>
    <div><h1>Saúde do produto ELO</h1><p>Visão agregada de telemetria sanitizada. Nenhum conteúdo de conversa é exibido.</p></div>
    <form id="controls">
      <input id="token" type="password" autocomplete="off" placeholder="Token interno">
      <select id="window" aria-label="Janela"><option value="24h">24h</option><option value="7d">7d</option><option value="30d">30d</option></select>
      <button type="submit">Atualizar</button>
    </form>
  </header>
  <div id="status" role="status"></div>
  <main class="grid" id="cards"></main>
  <script>
    (function () {
      var form = document.getElementById("controls");
      var status = document.getElementById("status");
      var cards = document.getElementById("cards");
      function percent(value) { return value === null || value === undefined ? "—" : Math.round(value * 100) + "%"; }
      function add(label, value, className) { var card = document.createElement("section"); card.className = "card"; card.innerHTML = "<div>" + label + "</div><div class=\"value " + (className || "") + "\">" + value + "</div>"; cards.appendChild(card); }
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        status.textContent = "Carregando…";
        fetch("/api/elo/telemetry/health?window=" + encodeURIComponent(document.getElementById("window").value), { headers: { "X-Elo-Telemetry-Admin": document.getElementById("token").value } })
          .then(function (response) { return response.json().then(function (body) { if (!response.ok) throw new Error(body.error || "dashboard_error"); return body; }); })
          .then(function (body) {
            var health = body.health || {};
            cards.textContent = "";
            add("Estado", health.state || "—", String(health.state || "").toLowerCase());
            add("Eventos", health.event_count || 0);
            add("Chat sucesso", percent(health.chat_success_rate));
            add("Auth sucesso", percent(health.auth_success_rate));
            add("Anexo sucesso", percent(health.attachment_success_rate));
            add("Imagem sucesso", percent(health.image_success_rate));
            add("P95 latência", health.p95_latency_ms === null ? "—" : health.p95_latency_ms + " ms");
            add("P95 imagem", health.p95_image_latency_ms === null ? "—" : health.p95_image_latency_ms + " ms");
            add("Offline", health.offline_event_count || 0);
            add("Crash / ANR", (health.crash_count || 0) + " / " + (health.anr_count || 0));
            status.textContent = "Atualizado agora.";
          })
          .catch(function (error) { status.textContent = "Não foi possível carregar: " + error.message; });
      });
    }());
  </script>
</body>
</html>
