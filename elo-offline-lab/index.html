<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ELO Offline Lab</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f7f9;
        color: #17191c;
      }

      main {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 720;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #4b5563;
      }

      form {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      input {
        flex: 1;
        min-width: 0;
        border: 1px solid #cfd5df;
        border-radius: 6px;
        padding: 12px 14px;
        font: inherit;
        background: white;
        color: #17191c;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 650;
        background: #176b5b;
        color: white;
        cursor: pointer;
      }

      .panel {
        border: 1px solid #d6dce5;
        border-radius: 8px;
        background: white;
        padding: 18px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #e8f2ef;
        color: #176b5b;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 12px;
      }

      pre {
        white-space: pre-wrap;
        margin: 0;
        font: inherit;
        line-height: 1.5;
      }

      @media (max-width: 560px) {
        form {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ELO Offline Lab</h1>
      <p>Laboratório isolado para validar música e memória locais sem alterar o ELO oficial.</p>
      <form data-form>
        <input data-command type="text" autocomplete="off" placeholder="Digite: toque Beethoven, pare, lembre que meu cachorro se chama Thor">
        <button type="submit">Enviar</button>
      </form>
      <section class="panel" aria-live="polite">
        <div class="status" data-status>ONLINE_UNVERIFIED</div>
        <pre data-output>Aguardando comando.</pre>
      </section>
    </main>
    <script src="./elo-offline-memory-adapter.js"></script>
    <script src="./elo-offline-router.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
