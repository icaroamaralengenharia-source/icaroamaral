name: ELO Photo Bridge APK

on:
  push:
    branches:
      - build/elo-photo-bridge-physical-test-2026-09-01

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/elo-photo-bridge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run bridge core tests
        run: node --test tests/elo-photo-bridge-core.test.mjs

      - name: Run bridge state tests
        run: node --test tests/elo-photo-bridge-state.test.mjs

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Validate physical test package
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/badging.txt
          grep "package: name='br.com.icaroamaral.elophotobridge.physicaltest'" app/build/outputs/apk/debug/badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/elo-photo-bridge-physicaltest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elo-photo-bridge-debug
          path: |
            android/elo-photo-bridge/app/build/outputs/apk/debug/elo-photo-bridge-physicaltest.apk
            android/elo-photo-bridge/app/build/outputs/apk/debug/badging.txt