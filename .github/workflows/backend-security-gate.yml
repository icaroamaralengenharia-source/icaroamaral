name: Backend Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "relatorio-qualidade-obras/elo-command-bridge.js"
      - "relatorio-qualidade-obras/elo-rdo-cloud-work-resolution.test.cjs"
      - "relatorio-qualidade-obras/elo-assistente-routing.test.cjs"
      - "relatorio-qualidade-obras/elo-routing-*-regression.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-pending-preview-routing.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-operational-preview.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-commercial-regressions.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-cancellation.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-session-binding.test.cjs"
      - "relatorio-qualidade-obras/elo-auth-refresh.test.cjs"
      - "relatorio-qualidade-obras/elo-assistente.js"
      - "relatorio-qualidade-obras/rdo-canonical-auth.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-security-gate.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "relatorio-qualidade-obras/elo-command-bridge.js"
      - "relatorio-qualidade-obras/elo-rdo-cloud-work-resolution.test.cjs"
      - "relatorio-qualidade-obras/elo-assistente-routing.test.cjs"
      - "relatorio-qualidade-obras/elo-routing-*-regression.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-pending-preview-routing.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-operational-preview.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-commercial-regressions.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-cancellation.test.cjs"
      - "relatorio-qualidade-obras/elo-rdo-session-binding.test.cjs"
      - "relatorio-qualidade-obras/elo-auth-refresh.test.cjs"
      - "relatorio-qualidade-obras/elo-assistente.js"
      - "relatorio-qualidade-obras/rdo-canonical-auth.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-security-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Backend auth and RDO security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Syntax gate
        run: |
          node --check src/app.js
          node --check src/auth-context.js
          node --check src/services/obrareport-transactional-service.js
          node --check tests/canonical-session-rdo-security.test.js
          node --check tests/elo-me-endpoint.test.js
          node --check src/services/obrareport-artifact-broker.js
          node --check src/services/obrareport-report-orchestrator.js
          node --check ../relatorio-qualidade-obras/elo-command-bridge.js
          node --check ../relatorio-qualidade-obras/elo-assistente.js
          node --check ../relatorio-qualidade-obras/elo-assistente-routing.test.cjs
          node --check ../relatorio-qualidade-obras/elo-routing-intent-regression.test.cjs
          node --check ../relatorio-qualidade-obras/elo-rdo-pending-preview-routing.test.cjs
          node --check ../relatorio-qualidade-obras/elo-rdo-operational-preview.test.cjs
          node --check ../relatorio-qualidade-obras/elo-rdo-commercial-regressions.test.cjs
          node --check ../relatorio-qualidade-obras/elo-rdo-cancellation.test.cjs
          node --check ../relatorio-qualidade-obras/elo-rdo-session-binding.test.cjs
          node --check ../relatorio-qualidade-obras/elo-auth-refresh.test.cjs
          node --check ../relatorio-qualidade-obras/elo-routing-budget-regression.test.cjs
          node --check tests/obrareport-artifact-broker.test.js
          node --check < ../apps-script-versionado/Code.gs
          if [[ -f tests/obrareport-rdo-tenant-isolation-p0.test.js ]]; then
            node --check tests/obrareport-rdo-tenant-isolation-p0.test.js
          fi

      - name: Auth, session, tenant, RDO and backend regression gate
        run: |
          test_files=(
            tests/auth-context.test.js
            tests/elo-auth-context-integration.test.js
            tests/elo-me-endpoint.test.js
            tests/canonical-session-rdo-security.test.js
            tests/obrareport-transactional-service.test.js
            tests/obrareport-artifact-broker.test.js
            tests/obrareport-step05-blockers.test.js
            tests/obrareport-step05-durable-documents.test.js
            tests/obrareport-rdo-work-scope.test.js
            tests/elo-rdo-intent-router.test.js
            tests/elo-action-bus-rdo.test.cjs
            tests/obrareport-rdo-generator-contract.test.js
          )
          if [[ -f tests/obrareport-rdo-tenant-isolation-p0.test.js ]]; then
            test_files+=(tests/obrareport-rdo-tenant-isolation-p0.test.js)
          fi
          node --test "${test_files[@]}"

      - name: Public ELO cloud work catalog and RDO frontend regression gate
        working-directory: .
        run: |
          node --test relatorio-qualidade-obras/elo-rdo-cloud-work-resolution.test.cjs
          node --test relatorio-qualidade-obras/elo-assistente-routing.test.cjs
          node --test relatorio-qualidade-obras/elo-routing-intent-regression.test.cjs relatorio-qualidade-obras/elo-routing-budget-regression.test.cjs
          node --test relatorio-qualidade-obras/elo-rdo-pending-preview-routing.test.cjs
          node --test relatorio-qualidade-obras/elo-rdo-operational-preview.test.cjs
          node --test relatorio-qualidade-obras/elo-rdo-commercial-regressions.test.cjs
          node --test relatorio-qualidade-obras/elo-rdo-cancellation.test.cjs
          node --test relatorio-qualidade-obras/elo-rdo-session-binding.test.cjs relatorio-qualidade-obras/elo-auth-refresh.test.cjs
          node --test relatorio-qualidade-obras/rdo-final-real-test-bugs.test.cjs relatorio-qualidade-obras/rdo-project-workspace.test.cjs relatorio-qualidade-obras/rdo-project-workspace-page.test.cjs

      - name: Stock Full atomic movement, offline and UI regression gate
        run: |
          node --test tests/stock-full-*.test.js
          node --test --test-name-pattern="stock full|frontend Stock Full" tests/ai-endpoint.test.js

      - name: RDO standalone auth, cloud contract, cache and material regression gate
        run: |
          node --test tests/rdo-api-cache.test.cjs tests/rdo-cloud-adapter.test.js tests/rdo-material-requests-anti-duplication.test.js tests/rdo-standalone-auth.test.js

      - name: Frontend production build
        working-directory: .
        run: npm run build

      - name: Complete diff whitespace gate
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          git cat-file -e "$base^{commit}"
          git diff --check "$base" HEAD
