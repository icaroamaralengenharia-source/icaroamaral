name: Backend Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "relatorio-qualidade-obras/elo-command-bridge.js"
      - "relatorio-qualidade-obras/elo-assistente.js"
      - "relatorio-qualidade-obras/rdo-canonical-auth.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-security-gate.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "relatorio-qualidade-obras/elo-command-bridge.js"
      - "relatorio-qualidade-obras/elo-assistente.js"
      - "relatorio-qualidade-obras/rdo-canonical-auth.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-security-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Backend auth and RDO security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Syntax gate
        run: |
          node --check src/app.js
          node --check src/auth-context.js
          node --check src/services/obrareport-transactional-service.js
          node --check tests/canonical-session-rdo-security.test.js
          node --check tests/elo-me-endpoint.test.js
          node --check src/services/obrareport-artifact-broker.js
          node --check src/services/obrareport-report-orchestrator.js
          node --check ../relatorio-qualidade-obras/elo-command-bridge.js
          node --check ../relatorio-qualidade-obras/elo-assistente.js
          node --check tests/obrareport-artifact-broker.test.js
          node --check < ../apps-script-versionado/Code.gs
          if [[ -f tests/obrareport-rdo-tenant-isolation-p0.test.js ]]; then
            node --check tests/obrareport-rdo-tenant-isolation-p0.test.js
          fi

      - name: Auth, session, tenant, RDO and backend regression gate
        run: |
          test_files=(
            tests/auth-context.test.js
            tests/elo-auth-context-integration.test.js
            tests/elo-me-endpoint.test.js
            tests/canonical-session-rdo-security.test.js
            tests/obrareport-transactional-service.test.js
            tests/obrareport-artifact-broker.test.js
            tests/obrareport-step05-blockers.test.js
            tests/obrareport-step05-durable-documents.test.js
            tests/obrareport-rdo-work-scope.test.js
            tests/elo-rdo-intent-router.test.js
            tests/elo-action-bus-rdo.test.cjs
            tests/obrareport-rdo-generator-contract.test.js
          )
          if [[ -f tests/obrareport-rdo-tenant-isolation-p0.test.js ]]; then
            test_files+=(tests/obrareport-rdo-tenant-isolation-p0.test.js)
          fi
          node --test "${test_files[@]}"

      - name: Stock Full atomic movement, offline and UI regression gate
        run: |
          node --test tests/stock-full-*.test.js
          node --test --test-name-pattern="stock full|frontend Stock Full" tests/ai-endpoint.test.js
