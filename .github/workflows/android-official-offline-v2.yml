name: Android Official Full Offline V2
on:
  push:
    branches: [fix/elo-official-full-plus-offline-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          apkanalyzer="$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -1)"
          "$aapt" dump badging "$apk" | grep -F "package: name='br.com.icaroamaral.elo' versionCode='3' versionName='0.3.0'"
          dex="$("$apkanalyzer" dex packages --defined-only "$apk")"
          for symbol in EloOfflineEngine EloApiClient EloNativeBridge EloFileChooserController EloTtsClient EloVoicePlayer EloWakeParser EloWakeController OfflineLabActivity EloBootReceiver; do grep -F "$symbol" <<<"$dex"; done
          test "$(unzip -Z1 "$apk" | grep -c '.opus$')" -eq 52
          test "$(python3 -c 'import json; print(len(json.load(open("app/src/main/assets/offline-media/catalog.json"))))')" -eq 50
      - uses: actions/upload-artifact@v4
        with:
          name: elo-oficial-v0.3.0-full-offline-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
