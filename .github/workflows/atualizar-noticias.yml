name: Atualizar notícias

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/atualizar-noticias.mjs"
      - "scripts/atualizar-conteudo-noticias.mjs"
      - "tests/atualizar-noticias.test.mjs"
      - "tests/atualizar-conteudo-noticias.test.mjs"
      - "dados/**"
      - ".github/workflows/atualizar-noticias.yml"

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Validar sintaxe
        run: |
          node --check scripts/atualizar-noticias.mjs
          node --check scripts/atualizar-conteudo-noticias.mjs

      - name: Executar testes
        run: |
          node --test tests/atualizar-noticias.test.mjs
          node --test tests/atualizar-conteudo-noticias.test.mjs

      - name: Atualizar JSON
        run: node scripts/atualizar-conteudo-noticias.mjs

      - name: Validar arquivos alterados
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "Sem mudanças para commitar."
            exit 0
          fi
          allowed="noticias/dados/noticias.json
noticias/dados/oportunidades.json"
          unexpected="$(comm -23 <(printf '%s
' "$changed" | sort) <(printf '%s
' "$allowed" | sort))"
          if [ -n "$unexpected" ]; then
            echo "Arquivo inesperado alterado; abortando."
            echo "$unexpected"
            exit 1
          fi

      - name: Commit automático
        run: |
          if git diff --quiet -- noticias/dados/noticias.json noticias/dados/oportunidades.json; then
            echo "Sem mudanças reais nos JSON."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/dados/noticias.json noticias/dados/oportunidades.json
          git commit -m "chore: atualiza notícias e oportunidades"
          git push