name: Atualizar noticias

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/atualizar-noticias.mjs"
      - "scripts/atualizar-conteudo-noticias.mjs"
      - "tests/atualizar-noticias.test.mjs"
      - "tests/atualizar-conteudo-noticias.test.mjs"
      - "dados/**"
      - ".github/workflows/atualizar-noticias.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-noticias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar conteudo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxe
        run: |
          node --check scripts/atualizar-noticias.mjs
          node --check scripts/atualizar-conteudo-noticias.mjs

      - name: Executar testes
        run: |
          node --test tests/atualizar-conteudo-noticias.test.mjs
          node --test tests/atualizar-noticias.test.mjs

      - name: Atualizar noticias
        run: node scripts/atualizar-noticias.mjs

      - name: Verificar alteracoes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar atualizacao
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- noticias/dados/noticias.json noticias/dados/oportunidades.json
          git commit -m "chore: atualiza noticias automaticamente"
          git push
