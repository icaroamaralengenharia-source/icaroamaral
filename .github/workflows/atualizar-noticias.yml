name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Validar sintaxe
        run: node --check scripts/atualizar-noticias.mjs

      - name: Executar testes
        run: node --test tests/atualizar-noticias.test.mjs

      - name: Atualizar JSON
        run: node scripts/atualizar-noticias.mjs

      - name: Validar arquivos alterados
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "Sem mudanças para commitar."
            exit 0
          fi
          if [ "$changed" != "noticias/dados/noticias.json" ]; then
            echo "Arquivo inesperado alterado; abortando."
            exit 1
          fi

      - name: Commit automático
        run: |
          if git diff --quiet -- noticias/dados/noticias.json; then
            echo "Sem mudanças reais no JSON."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/dados/noticias.json
          git commit -m "chore: atualiza notícias de engenharia"
          git push
